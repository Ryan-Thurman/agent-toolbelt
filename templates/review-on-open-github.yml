# This workflow fires a fresh, headless code review when a PR opens or updates.
#
# Copy this file into a target repo as .github/workflows/agent-pr-review.yml. Then add an
# ANTHROPIC_API_KEY secret in the repo settings, under Actions secrets.
#
# The target repo must commit the Toolbelt files that install.sh writes. The headless
# run of /pr-review reads them from the checkout. The workflow does not install them.
#
# The workflow runs the pr-review skill in headless mode and posts findings as inline
# PR comments. The review logic, tiering, and host posting all live in /pr-review --comment.
# This file is only the trigger. The explanation and security notes are in
# skills/review-on-open/references/ci-event.md.
#
# Security: this uses pull_request (untrusted context, read-only token, no secrets on fork PRs).
# It does not use pull_request_target. Do not change this without reading the hardening section.

name: agent-pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read          # read the code under review
  pull-requests: write    # post the inline review, and nothing else

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true   # a newer push supersedes an in-flight review of an older SHA

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip drafts. Review only ready PRs. Remove this line to review drafts too.
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pr-review diffs base..head, so it needs full history

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Load instruction files from the base ref
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # A PR must not change the rules that review it. Restore the base versions of the
        # root instruction files, and remove the ones that the base does not have. Replace the
        # .agents/ and .claude/ folders too: they hold the reviewer skills and the scan script.
        run: |
          for f in CLAUDE.md AGENTS.md .pr-review.md .claude/pr-review.md STYLE_GUIDE.md
          do
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null
            then
              mkdir -p "$(dirname "$f")"
              git show "$BASE_SHA:$f" > "$f"
            else
              rm -f "$f"
            fi
          done
          for d in .agents .claude
          do
            rm -rf "$d"
            if git cat-file -e "$BASE_SHA:$d" 2>/dev/null
            then
              git archive "$BASE_SHA" "$d" | tar -x
            fi
          done

      - name: Review the PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        # Scope Bash to the verbs review uses. A bare `Bash` grants every command,
        # including `gh pr merge`. Headless `-p` denies anything the allowlist misses, so
        # each command review runs must be named. The `=`-joined form is required:
        # --allowedTools is variadic and the space-separated form swallows the next argument.
        run: |
          claude -p "/pr-review $PR --comment" \
            --allowedTools="Bash(gh auth status:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git symbolic-ref:*),Bash(git remote:*),Bash(git fetch:*),Bash(jq:*),Bash(python3 .agents/shared/contracts/scripts/react-rule-scan.py:*),Read,Grep,Glob,Task" \
            --disallowedTools="Edit,Write,NotebookEdit,WebFetch,WebSearch"
